[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "littleuqu"
version = "0.3.1"
description = "小小优趣分类查询与音视频下载 CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "rich>=13", "requests>=2.31", "platformdirs>=4", "m3u8>=5", "pycryptodome>=3.20"]

[project.urls]
Homepage = "https://github.com/QinGeneral/littleUqu"
Repository = "https://github.com/QinGeneral/littleUqu"
Issues = "https://github.com/QinGeneral/littleUqu/issues"

[project.scripts]
littleuqu = "littleuqu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/littleuqu"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
